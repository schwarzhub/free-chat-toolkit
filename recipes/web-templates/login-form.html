<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<style>
  :root { --bg: #f8fafc; --card: #fff; --primary: #6366f1; --text: #1e293b; --muted: #94a3b8; --border: #e2e8f0; --radius: 12px; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: system-ui, sans-serif; background: var(--bg); min-height: 100vh; display: grid; place-items: center; padding: 1rem; }
  .card { background: var(--card); border-radius: var(--radius); padding: 2.5rem 2rem; width: 100%; max-width: 400px; box-shadow: 0 4px 24px rgba(0,0,0,.06); }
  .card h1 { font-size: 1.5rem; margin-bottom: .25rem; }
  .card p { color: var(--muted); margin-bottom: 1.5rem; font-size: .875rem; }
  .field { margin-bottom: 1rem; position: relative; }
  .field label { display: block; font-size: .875rem; font-weight: 500; margin-bottom: .375rem; }
  .field input { width: 100%; padding: .75rem 1rem; border: 1px solid var(--border); border-radius: 8px; font-size: .9375rem; transition: .15s; }
  .field input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99,102,241,.15); }
  .password-wrap { position: relative; }
  .toggle-pw { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--muted); font-size: .875rem; }
  .options { display: flex; justify-content: space-between; align-items: center; font-size: .875rem; margin: 1rem 0 1.5rem; }
  .options label { display: flex; align-items: center; gap: .375rem; }
  .options a { color: var(--primary); text-decoration: none; }
  button[type="submit"] { width: 100%; padding: .75rem; background: var(--primary); color: #fff; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: .2s; }
  button[type="submit"]:hover { opacity: .9; }
  .social { display: flex; gap: .75rem; margin-top: 1.25rem; }
  .social button { flex: 1; padding: .625rem; border: 1px solid var(--border); border-radius: 8px; background: var(--card); cursor: pointer; font-size: .875rem; transition: .15s; }
  .social button:hover { background: var(--bg); }
  .divider { text-align: center; color: var(--muted); font-size: .75rem; margin: 1.25rem 0; position: relative; }
  .divider::before, .divider::after { content: ''; position: absolute; top: 50%; width: 42%; height: 1px; background: var(--border); }
  .divider::before { left: 0; } .divider::after { right: 0; }
</style>
</head>
<body>
<div class="card" role="form" aria-label="Sign in form">
  <h1>Welcome back</h1>
  <p>Sign in to your account</p>
  <form autocomplete="off">
    <div class="field"><label for="email">Email</label><input id="email" type="email" placeholder="you@example.com" required autocomplete="email"></div>
    <div class="field"><label for="password">Password</label><div class="password-wrap"><input id="password" type="password" placeholder="••••••••" required autocomplete="current-password" aria-describedby="pw-toggle"><button type="button" class="toggle-pw" id="pw-toggle" onclick="const i=this.previousElementSibling; i.type=i.type==='password'?'text':'password'; this.textContent=i.type==='password'?'👁️':'🙈'; this.setAttribute('aria-label', i.type==='password'?'Show password':'Hide password')" aria-label="Show password">👁️</button></div></div>
    <div class="options"><label><input type="checkbox" checked> Remember me</label><a href="#">Forgot password?</a></div>
    <button type="submit">Sign In</button>
  </form>
  <div class="divider" role="separator" aria-label="or">or continue with</div>
  <div class="social"><button aria-label="Sign in with Google">🔵 Google</button><button aria-label="Sign in with GitHub">⚫ GitHub</button></div>
  <p style="text-align:center;margin-top:1.25rem;font-size:.875rem;color:var(--muted)">No account? <a href="#" style="color:var(--primary);text-decoration:none;font-weight:500;">Sign up</a></p>
</div>
</body>
</html>
