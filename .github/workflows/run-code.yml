name: run-code
run-name: run-code ${{ inputs.rid }}

# Bounded, sandboxed execution of a proposed tool / validation snippet for this toolkit.
# The submitted code runs in a NO-NETWORK, resource-capped container inside the ephemeral runner,
# with NO token permissions and NO secrets in scope. Result is uploaded as a short-lived artifact.
on:
  workflow_dispatch:
    inputs:
      rid:
        description: "correlation id (alnum)"
        required: true
      code_b64:
        description: "gzip+base64 of the Python source to run"
        required: true

permissions: {}          # the job's GITHUB_TOKEN gets nothing

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: decode
        env:
          CODE_B64: ${{ inputs.code_b64 }}     # via env, never interpolated into the shell
        run: |
          mkdir -p job
          printf '%s' "$CODE_B64" | base64 -d | gunzip > job/user.py || { echo "decode failed" >&2; exit 2; }
          bytes=$(wc -c < job/user.py)
          echo "decoded $bytes bytes"
          [ "$bytes" -le 200000 ] || { echo "code too large" >&2; exit 2; }

      # A curated, read-only set of pure-consumer packages, installed on the RUNNER (which has
      # network) into ./libs using the exact sandbox image so the ABI matches, then mounted READ-ONLY
      # into the no-network exec container. The sandbox stays network-isolated, resource-capped, and
      # ephemeral — these are libraries, not new binaries or network access. Cached across runs.
      - name: cache sandbox libs
        id: libcache
        uses: actions/cache@v4
        with:
          path: libs
          key: runcode-libs-v1-py312-numpy-pandas-matplotlib-scipy-bs4-lxml-pillow-requests-sympy

      - name: install curated packages (cache miss only)
        if: steps.libcache.outputs.cache-hit != 'true'
        run: |
          docker pull -q python:3.12-slim >/dev/null 2>&1 || true
          mkdir -p libs
          docker run --rm -v "$PWD/libs":/libs python:3.12-slim \
            pip install --no-cache-dir --target /libs \
            numpy pandas matplotlib scipy beautifulsoup4 lxml pillow requests sympy

      - name: run (no-network sandbox)
        run: |
          docker pull -q python:3.12-slim >/dev/null 2>&1 || true   # keep pull noise out of stderr
          set +e
          timeout 45 docker run --rm --network none \
            --memory 1024m --cpus 1 --pids-limit 256 \
            -v "$PWD/job":/work -v "$PWD/libs":/libs:ro \
            -e PYTHONPATH=/libs -e MPLBACKEND=Agg -e HOME=/work \
            -w /work python:3.12-slim \
            python -B -s user.py > out.txt 2> err.txt
          echo $? > code.txt
          set -e

      - name: package result
        if: always()
        run: |
          python3 - <<'PY'
          import json
          def rd(p, cap=8_000_000):
              try:
                  b = open(p, "rb").read(cap + 1)
                  return b[:cap].decode("utf-8", "replace"), len(b) > cap
              except Exception:
                  return "", False
          out, ot = rd("out.txt"); err, et = rd("err.txt")
          try:
              rc = int(open("code.txt").read().strip())
          except Exception:
              rc = None
          json.dump({"exit_code": rc, "stdout": out, "stdout_truncated": ot,
                     "stderr": err, "stderr_truncated": et,
                     "timed_out": rc == 124}, open("result.json", "w"))
          PY

      - name: upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ inputs.rid }}
          path: result.json
          retention-days: 1
